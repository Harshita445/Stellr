version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: constellation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      CONSTELLATION_ENVIRONMENT: development
      CONSTELLATION_DEBUG: "true"
      CONSTELLATION_DATABASE__URL: postgresql+asyncpg://postgres:postgres@db:5432/constellation
      CONSTELLATION_DATABASE__ECHO: "true"
      CONSTELLATION_FRONTEND_URL: http://localhost:3000
      CONSTELLATION_AUTH__JWT_SECRET: dev-secret
      CONSTELLATION_AUTH__DEVICE_FINGERPRINT_SALT: dev-salt
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
