services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-constellation}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-constellation}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONSTELLATION_ENVIRONMENT: ${CONSTELLATION_ENVIRONMENT:-production}
      CONSTELLATION_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-constellation}
      CONSTELLATION_AUTH__JWT_SECRET: ${CONSTELLATION_JWT_SECRET:?JWT secret is required}
      CONSTELLATION_AUTH__DEVICE_FINGERPRINT_SALT: ${CONSTELLATION_FINGERPRINT_SALT:?Fingerprint salt is required}
      CONSTELLATION_FRONTEND_URL: ${CONSTELLATION_FRONTEND_URL:-http://localhost}
      CONSTELLATION_CORS_ORIGINS: ${CONSTELLATION_CORS_ORIGINS:-["http://localhost"]}
      CONSTELLATION_LOG_LEVEL: ${CONSTELLATION_LOG_LEVEL:-INFO}
    expose:
      - 8000

  # ── Next.js Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    expose:
      - 3000

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
